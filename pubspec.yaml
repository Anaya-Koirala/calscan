name: calscan
description: Scan event flyers and add them to your calendar.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_mlkit_text_recognition: ^0.16.0
  image_picker: ^1.1.2
  image_cropper: ^12.2.1
  device_calendar: ^4.3.3
  share_plus: ^13.3.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  timezone: ^0.9.4
  file_picker: ^12.0.0
  enough_icalendar: ^0.17.0
  open_filex: ^4.7.0
  chrono_dart: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
